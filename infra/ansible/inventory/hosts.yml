---
all:
  children:
    ml_workers:
      hosts:
        ml-worker-01:
          ansible_host: "{{ lookup('env', 'ML_WORKER_IP') | default('REPLACE_WITH_VM_IP', true) }}"
          ansible_user: ubuntu
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: ~/.ssh/gcp_ml_key
      vars:
        ansible_user: ubuntu
        ansible_python_interpreter: /usr/bin/python3
        gpu_enabled: true
        app_repo_url: "https://github.com/Hongik-graduProject/ML.git"
        app_repo_branch: main
        app_dir: /opt/ml-pipeline
        venv_dir: /opt/ml-pipeline/venv
        gcp_project_id: "{{ lookup('env', 'GCP_PROJECT_ID') | default('YOUR_GCP_PROJECT_ID', true) }}"
        gcs_bucket: "{{ lookup('env', 'GCS_BUCKET') | default('YOUR_GCS_BUCKET', true) }}"
        cloud_sql_instance: "{{ lookup('env', 'CLOUD_SQL_INSTANCE') | default('YOUR_PROJECT:REGION:INSTANCE', true) }}"
