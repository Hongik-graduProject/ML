---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - software-properties-common
      - curl
      - wget
      - git
      - build-essential
      - libssl-dev
      - libffi-dev
      - ca-certificates
      - gnupg
      - lsb-release
      - unzip
    state: present

- name: Add deadsnakes PPA for Python 3.11
  ansible.builtin.apt_repository:
    repo: ppa:deadsnakes/ppa
    state: present
    update_cache: true

- name: Install Python 3.11 and related packages
  ansible.builtin.apt:
    name:
      - python3.11
      - python3.11-venv
      - python3.11-dev
      - python3.11-distutils
    state: present

- name: Install pip for Python 3.11
  ansible.builtin.shell:
    cmd: curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
    creates: /usr/local/lib/python3.11/dist-packages/pip

- name: Set python3.11 as default python3
  community.general.alternatives:
    name: python3
    path: /usr/bin/python3.11
    link: /usr/bin/python3
    priority: 100

- name: Install Korean fonts (Nanum)
  ansible.builtin.apt:
    name:
      - fonts-nanum
      - fonts-nanum-coding
      - fonts-nanum-extra
    state: present

- name: Install locale support packages
  ansible.builtin.apt:
    name:
      - locales
      - language-pack-ko
    state: present

- name: Generate ko_KR.UTF-8 locale
  community.general.locale_gen:
    name: ko_KR.UTF-8
    state: present

- name: Set system locale to ko_KR.UTF-8
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANG="
    line: "LANG=ko_KR.UTF-8"
    create: true
    mode: "0644"

- name: Set LANGUAGE in locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANGUAGE="
    line: "LANGUAGE=ko_KR:ko:en"
    create: true
    mode: "0644"

- name: Refresh font cache
  ansible.builtin.command: fc-cache -fv
  changed_when: false
