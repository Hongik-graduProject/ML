---
- name: Ensure app parent directory exists
  ansible.builtin.file:
    path: "{{ app_dir | dirname }}"
    state: directory
    mode: "0755"

- name: Clone or update app repository
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ app_repo_branch | default('main') }}"
    force: true
    update: true
  register: git_result

- name: Set app directory ownership
  ansible.builtin.file:
    path: "{{ app_dir }}"
    owner: ubuntu
    group: ubuntu
    recurse: true

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3.11 -m venv "{{ venv_dir }}"
    creates: "{{ venv_dir }}/bin/activate"

- name: Upgrade pip inside venv
  ansible.builtin.pip:
    name:
      - pip
      - setuptools
      - wheel
    virtualenv: "{{ venv_dir }}"
    state: latest

- name: Install Python dependencies from requirements.txt
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ venv_dir }}"
    state: present
  when: git_result.changed or (force_install | default(false))

- name: Create data directory
  ansible.builtin.file:
    path: "{{ app_dir }}/data"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Create cache directory
  ansible.builtin.file:
    path: "{{ app_dir }}/data/cache"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Create results output directory
  ansible.builtin.file:
    path: "{{ app_dir }}/results"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Create logs directory
  ansible.builtin.file:
    path: "{{ app_dir }}/logs"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
