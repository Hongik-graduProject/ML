---
- name: Check if gcloud CLI is installed
  ansible.builtin.command: gcloud --version
  register: gcloud_check
  changed_when: false
  failed_when: false

- name: Install gcloud CLI if not present
  when: gcloud_check.rc != 0
  block:
    - name: Add Google Cloud SDK apt repository key
      ansible.builtin.get_url:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        dest: /usr/share/keyrings/cloud.google.gpg
        mode: "0644"

    - name: Add Google Cloud SDK apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
        filename: google-cloud-sdk
        state: present
        update_cache: true

    - name: Install google-cloud-cli
      ansible.builtin.apt:
        name: google-cloud-cli
        state: present

- name: Fetch DART_API_KEY from Secret Manager
  ansible.builtin.command:
    cmd: >
      gcloud secrets versions access latest
      --secret=DART_API_KEY
      --project={{ gcp_project_id }}
  register: dart_api_key_result
  changed_when: false
  no_log: true

- name: Fetch DB_PASSWORD from Secret Manager
  ansible.builtin.command:
    cmd: >
      gcloud secrets versions access latest
      --secret=DB_PASSWORD
      --project={{ gcp_project_id }}
  register: db_password_result
  changed_when: false
  no_log: true
  ignore_errors: true

- name: Create .env file from secrets
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  no_log: true
  vars:
    dart_api_key: "{{ dart_api_key_result.stdout }}"
    db_password: "{{ db_password_result.stdout | default('') }}"

- name: Ensure .env is not world-readable
  ansible.builtin.file:
    path: "{{ app_dir }}/.env"
    mode: "0600"
    owner: ubuntu
    group: ubuntu
