---
- name: Full server provisioning for ML pipeline
  hosts: ml_workers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display target host info
      ansible.builtin.debug:
        msg: "Provisioning {{ inventory_hostname }} ({{ ansible_host }}) — OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  roles:
    - role: common
      tags: [common, packages]

    - role: gpu_driver
      tags: [gpu, drivers]
      when: gpu_enabled | default(false)

    - role: database
      tags: [database, cloud-sql]

    - role: secrets
      tags: [secrets, env]

    - role: app
      tags: [app, deploy]

  post_tasks:
    - name: Verify Python 3.11 installation
      ansible.builtin.command: python3.11 --version
      register: py_version
      changed_when: false

    - name: Display Python version
      ansible.builtin.debug:
        msg: "Python version: {{ py_version.stdout }}"

    - name: Display provisioning complete message
      ansible.builtin.debug:
        msg: "Server provisioning complete on {{ inventory_hostname }}"
