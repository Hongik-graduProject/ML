---
- name: Deploy / update application code
  hosts: ml_workers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display deployment target
      ansible.builtin.debug:
        msg: "Deploying code update to {{ inventory_hostname }} ({{ ansible_host }})"

  roles:
    - role: app
      tags: [app, deploy]

  post_tasks:
    - name: Confirm requirements are up to date
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        state: present

    - name: Display deploy complete message
      ansible.builtin.debug:
        msg: "Code deployment complete on {{ inventory_hostname }}"
